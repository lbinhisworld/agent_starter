<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>售前分析报告</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="css/report.css" />
</head>
<body class="report-page-body">
  <div id="reportToast" class="report-toast" hidden role="status" aria-live="polite"></div>

  <header class="report-header">
    <div class="report-header-inner">
      <h1 class="report-title">售前分析报告</h1>
      <p id="reportSubtitle" class="report-subtitle">加载中…</p>
    </div>
  </header>

  <main class="report-main">
    <p id="reportLoadError" class="report-load-error" hidden></p>

    <section class="report-section" aria-labelledby="sec-requirement">
      <h2 id="sec-requirement" class="report-section-title">需求洞察</h2>
      <div id="reportRequirement" class="report-section-body"></div>
    </section>

    <section class="report-section" aria-labelledby="sec-value-stream">
      <h2 id="sec-value-stream" class="report-section-title">价值流与痛点标注</h2>
      <div id="reportValueStream" class="report-section-body"></div>
    </section>

    <section class="report-section" aria-labelledby="sec-global-itgap">
      <h2 id="sec-global-itgap" class="report-section-title">IT设计补齐</h2>
      <div id="reportGlobalItGap" class="report-section-body"></div>
    </section>

    <section class="report-section" aria-labelledby="sec-bo-list">
      <h2 id="sec-bo-list" class="report-section-title">业务对象列表</h2>
      <div id="reportBusinessObjects" class="report-section-body"></div>
    </section>

    <section class="report-section" aria-labelledby="sec-graph">
      <h2 id="sec-graph" class="report-section-title">业务对象关联图</h2>
      <div id="reportGraph" class="report-section-body report-graph-wrap"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
  <script src="config.js"></script>
  <script src="config.local.js"></script>
  <script>
    window.showError = function (msg) {
      var t = document.getElementById('reportToast');
      var text = msg != null ? String(msg) : '';
      if (t) {
        t.textContent = text;
        t.hidden = !text;
        if (text) {
          setTimeout(function () {
            try {
              t.hidden = true;
            } catch (e) {}
          }, 4500);
        }
      } else {
        alert(text);
      }
    };
  </script>
  <script src="js/auth-runtime.js"></script>
  <script src="js/utils.js"></script>
  <script>
    window.fetchDeepSeekChat =
      window.fetchDeepSeekChat ||
      function () {
        return Promise.resolve({ content: '{}', usage: {}, model: '', durationMs: 0 });
      };
  </script>
  <script src="js/valueStream.js"></script>
  <script type="module" src="js/core/task8-global-itgap.js"></script>
  <script src="js/report-global-itgap-render.js"></script>
  <script src="js/report-formal-render.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="js/report-page.js"></script>
</body>
</html>
